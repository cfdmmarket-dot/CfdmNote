<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2340"/>
      <stop offset="100%" stop-color="#0e1525"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#cc8800"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e5498"/>
      <stop offset="100%" stop-color="#1a3468"/>
    </linearGradient>
  </defs>

  <!-- Círculo de fundo -->
  <circle cx="128" cy="128" r="122" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="119" fill="none" stroke="#2e4a80" stroke-width="2"/>

  <!-- ── DOCUMENTO (direita, atrás da chave) ──────────────────────────── -->
  <!-- corpo -->
  <rect x="138" y="44" width="74" height="96" rx="8" fill="url(#doc)"/>
  <!-- dobra -->
  <polygon points="196,44 212,44 212,62 196,62" fill="#0e1a35"/>
  <polyline points="196,44 196,62 212,62" fill="none" stroke="#4070b0" stroke-width="1.5"/>
  <!-- linhas texto -->
  <rect x="148" y="76" width="50" height="5" rx="2.5" fill="#60b8ff" opacity="0.9"/>
  <rect x="148" y="88" width="42" height="4" rx="2"   fill="#60b8ff" opacity="0.65"/>
  <rect x="148" y="99" width="46" height="4" rx="2"   fill="#60b8ff" opacity="0.55"/>
  <rect x="148" y="110" width="34" height="4" rx="2"  fill="#60b8ff" opacity="0.4"/>
  <!-- badge wiki-link -->
  <rect x="150" y="120" width="38" height="14" rx="4" fill="#0a1428" stroke="#60b8ff" stroke-width="1.2"/>
  <text x="169" y="131" font-family="monospace" font-size="9" font-weight="bold"
        fill="#60b8ff" text-anchor="middle">[[]]</text>

  <!-- ── CHAVE (esquerda e frente) ────────────────────────────────────── -->
  <!-- Cabeça da chave - círculo grande -->
  <circle cx="98" cy="118" r="34" fill="url(#key)"/>
  <circle cx="98" cy="118" r="20" fill="#0e1525"/>
  <!-- brilho -->
  <circle cx="88" cy="108" r="7" fill="#fff5aa" opacity="0.4"/>

  <!-- Haste da chave (diagonal -42 graus = descendo para direita) -->
  <!-- Usando coordenadas calculadas para haste vertical + rotação -->
  <g transform="rotate(-42, 98, 118)">
    <!-- haste -->
    <rect x="91" y="148" width="14" height="62" rx="5" fill="url(#key)"/>
    <!-- dente 1 -->
    <rect x="105" y="170" width="16" height="9" rx="3" fill="url(#key)"/>
    <!-- dente 2 -->
    <rect x="105" y="188" width="13" height="9" rx="3" fill="url(#key)"/>
  </g>

  <!-- ── TEXTO (rodapé) ───────────────────────────────────────────────── -->
  <text x="128" y="228"
        font-family="Arial, sans-serif"
        font-size="14" font-weight="700" letter-spacing="4"
        fill="#60b8ff" text-anchor="middle" opacity="0.75">CFDMNOTE</text>
</svg>
