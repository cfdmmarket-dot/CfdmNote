<?xml version="1.0" encoding="UTF-8"?>
<!-- CfdmNote — IA button icon, 32x32, estilo CFDM Holding -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cc" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cr" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="pl" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pr" x1="0.8" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%"   stop-color="#1e40af" stop-opacity="0.1"/>
      <stop offset="40%"  stop-color="#60a5fa" stop-opacity="1.0"/>
      <stop offset="60%"  stop-color="#93c5fd" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Orbital ring — behind, bottom -->
  <ellipse cx="16" cy="19" rx="12" ry="3"
           fill="none" stroke="url(#ring)" stroke-width="2"
           opacity="0.45"/>

  <!-- Crown facets
       Table:  10,6 → 22,6
       Girdle: 4,15 → 28,15
  -->
  <polygon points="4,15  10,6  16,6  16,15"   fill="url(#cl)" opacity="0.92"/>
  <polygon points="10,6  22,6  22,15  10,15"  fill="url(#cc)" opacity="0.88"/>
  <polygon points="16,6  22,6  28,15  16,15"  fill="url(#cr)" opacity="0.88"/>
  <!-- Far triangles -->
  <polygon points="4,15  10,6  10,15"          fill="#dbeafe"  opacity="0.38"/>
  <polygon points="22,6  28,15 22,15"          fill="#1e40af"  opacity="0.42"/>
  <!-- Table -->
  <line x1="10" y1="6" x2="22" y2="6"         stroke="white"  stroke-width="1.6" opacity="0.92"/>
  <!-- Table highlight -->
  <polygon points="10,6 22,6 20,9 12,9"        fill="white"    opacity="0.28"/>
  <!-- Crown outline -->
  <polyline points="4,15 10,6 22,6 28,15"      fill="none" stroke="#93c5fd" stroke-width="1.1" opacity="0.72"/>
  <!-- Girdle -->
  <line x1="4" y1="15" x2="28" y2="15"        stroke="#bfdbfe" stroke-width="1.0" opacity="0.65"/>

  <!-- Orbital ring — front -->
  <ellipse cx="16" cy="19" rx="12" ry="3"
           fill="none" stroke="url(#ring)" stroke-width="2.5"
           opacity="0.85"/>
  <!-- Ring highlight -->
  <ellipse cx="16" cy="19" rx="12" ry="3"
           fill="none" stroke="white" stroke-width="0.8"
           stroke-dasharray="10,30" stroke-dashoffset="5"
           opacity="0.50"/>

  <!-- Pavilion -->
  <polygon points="4,15   9,15  16,27"         fill="url(#pl)" opacity="0.90"/>
  <polygon points="9,15  16,15  16,27"         fill="#1e3a8a"  opacity="0.78"/>
  <polygon points="16,15 23,15  16,27"         fill="#1e3a8a"  opacity="0.72"/>
  <polygon points="23,15 28,15  16,27"         fill="url(#pr)" opacity="0.86"/>
  <!-- Pavilion lines -->
  <line x1="9"  y1="15" x2="16" y2="27"       stroke="white"  stroke-width="0.5" opacity="0.22"/>
  <line x1="16" y1="15" x2="16" y2="27"       stroke="white"  stroke-width="0.7" opacity="0.30"/>
  <line x1="23" y1="15" x2="16" y2="27"       stroke="white"  stroke-width="0.5" opacity="0.22"/>
  <!-- Pavilion outline -->
  <polyline points="4,15 16,27 28,15"          fill="none" stroke="#60a5fa" stroke-width="1.1" opacity="0.65"/>

  <!-- Sparkles -->
  <g transform="translate(8,4)" filter="url(#g)" opacity="0.85">
    <line x1="0" y1="-4" x2="0" y2="4"        stroke="white" stroke-width="1.2"/>
    <line x1="-4" y1="0" x2="4" y2="0"        stroke="white" stroke-width="1.2"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="white" stroke-width="0.6"/>
    <line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" stroke="white" stroke-width="0.6"/>
  </g>
  <circle cx="24" cy="4" r="1.4" fill="white"  opacity="0.70" filter="url(#g)"/>
  <circle cx="13" cy="3" r="1.8" fill="white"  opacity="0.75" filter="url(#g)"/>
</svg>
