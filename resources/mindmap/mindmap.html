<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="qrc:/cfdmnote/mindmap/mind-elixir.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1b2e; }
  #map { width: 100%; height: 100%; }

  /* Reduz espaçamento entre nós */
  #map {
    --node-gap-x: 12px;
    --node-gap-y: 6px;
    --main-gap-x: 32px;
    --main-gap-y: 18px;
    --root-radius: 20px;
    --main-radius: 12px;
  }

  /* Oculta toolbar interna do Mind Elixir — usamos a do Qt */
  .mind-elixir-toolbar { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>

<script src="qrc:/cfdmnote/mindmap/mind-elixir.js"></script>
<script>
var mind = null;

function initMindMap(data) {
  try {
    var ME = (typeof MindElixir === 'function') ? MindElixir
           : (MindElixir && MindElixir.default) ? MindElixir.default
           : null;

    if (!ME) {
      document.body.innerHTML =
        '<div style="color:orange;padding:20px;font-family:sans-serif;">'
        + 'Erro: MindElixir não carregou.</div>';
      return;
    }

    if (mind) {
      if (typeof mind.destroy === 'function') mind.destroy();
      document.getElementById('map').innerHTML = '';
      mind = null;
    }

    mind = new ME({
      el: '#map',
      direction: ME.SIDE !== undefined ? ME.SIDE : 2,
      draggable: true,
      contextMenu: false,
      toolBar: false,
      nodeMenu: false,
      keypress: false,
      before: {
        insertSibling: function() { return false; },
        addChild:      function() { return false; },
        editNode:      function() { return false; },
      }
    });
    mind.init(data);

    // Centraliza e ajusta zoom para caber tudo
    setTimeout(function() {
      if (mind && typeof mind.toCenter === 'function') mind.toCenter();
    }, 100);

    // Notifica Qt quando um nó é selecionado
    if (mind.bus && typeof mind.bus.addListener === 'function') {
      mind.bus.addListener('selectNode', function(node) {
        var payload = JSON.stringify({
          id:    node.id    || '',
          topic: node.topic || '',
          type:  node.type  || 'group'
        });
        document.title = 'SELECT:' + payload;
      });
    }

  } catch(e) {
    document.body.innerHTML =
      '<div style="color:white;padding:20px;font-family:sans-serif;">'
      + '<b>Erro:</b><br>' + e.message
      + '<br><pre style="font-size:10px;color:#fbb">' + e.stack + '</pre></div>';
  }
}

// Funções de zoom chamadas pelo Qt
function zoomIn()     { if (mind && mind.scale) mind.scale(1.2); }
function zoomOut()    { if (mind && mind.scale) mind.scale(0.8); }
function zoomReset()  { if (mind && mind.toCenter) mind.toCenter(); }
</script>
</body>
</html>
