<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="qrc:/cfdmnote/mindmap/mind-elixir.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1b2e; }
  #map { width: 100%; height: 100%; }

  /* Sobrescreve tema para combinar com CfdmNote */
  me-root me-parent .mind-elixir-node {
    background: #2b6cb0;
    color: white;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  me-epnode .mind-elixir-node {
    font-size: 12px;
  }
  .mind-elixir-toolbar {
    background: #1a365d !important;
    border-radius: 8px;
  }
  .mind-elixir-toolbar button {
    color: white !important;
  }
</style>
</head>
<body>
<div id="map"></div>

<script src="qrc:/cfdmnote/mindmap/mind-elixir.js"></script>
<script>
var mind = null;

// Recebe o objeto de dados do banco e inicializa o mapa
// data: objeto JS (não string) — injetado diretamente pelo Qt via runJavaScript
function initMindMap(data) {
  try {
    // Resolve o construtor: IIFE exporta em .default
    var ME = (typeof MindElixir === 'function') ? MindElixir
           : (MindElixir && MindElixir.default) ? MindElixir.default
           : null;

    if (!ME) {
      document.body.innerHTML =
        '<div style="color:orange;padding:20px;font-family:sans-serif;">'
        + 'Erro: MindElixir não carregou. Verifique o arquivo JS.</div>';
      return;
    }

    // Destroi instância anterior corretamente
    if (mind) {
      if (typeof mind.destroy === 'function') mind.destroy();
      document.getElementById('map').innerHTML = '';
      mind = null;
    }

    mind = new ME({
      el: '#map',
      direction: ME.SIDE !== undefined ? ME.SIDE : 2,
      draggable: true,
      contextMenu: false,
      toolBar: true,
      nodeMenu: false,
      keypress: true,
      before: {
        insertSibling: function() { return false; },
        addChild:      function() { return false; },
        editNode:      function() { return false; },
      }
    });
    mind.init(data);

    // Notifica Qt quando um nó é selecionado
    mind.bus.addListener('selectNode', function(node) {
      var payload = JSON.stringify({
        id:    node.id    || '',
        topic: node.topic || '',
        type:  node.type  || 'group'
      });
      document.title = 'SELECT:' + payload;
    });

  } catch(e) {
    document.body.innerHTML =
      '<div style="color:white;padding:20px;font-family:sans-serif;">'
      + '<b>Erro ao carregar mapa mental:</b><br>' + e.message
      + '<br><pre style="font-size:10px;color:#fbb">' + e.stack + '</pre></div>';
  }
}
</script>
</body>
</html>
