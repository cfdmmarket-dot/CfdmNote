<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="qrc:/cfdmnote/mindmap/mind-elixir.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
  #map { width: 100%; height: 100%; }
  .mind-elixir-toolbar { display: none !important; }
  .mind-elixir-ghost   { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>
<script src="qrc:/cfdmnote/mindmap/mind-elixir.js"></script>
<script>
var mind = null;

function initMindMap(data) {
  try {
    var ME = (typeof MindElixir === 'function') ? MindElixir
           : (typeof MindElixirLite !== 'undefined' && MindElixirLite.default) ? MindElixirLite.default
           : (typeof MindElixir !== 'undefined' && MindElixir.default) ? MindElixir.default
           : null;

    if (!ME) {
      document.body.innerHTML =
        '<div style="color:red;padding:20px;">Erro: MindElixir não carregou.</div>';
      return;
    }

    if (mind) {
      if (typeof mind.destroy === 'function') mind.destroy();
      document.getElementById('map').innerHTML = '';
      mind = null;
    }

    var cfdmTheme = {
      name: 'CfdmNote',
      type: 'light',
      palette: [
        '#3182ce', // azul
        '#38a169', // verde
        '#805ad5', // roxo
        '#dd6b20', // laranja (só 1 de 8)
        '#319795', // teal
        '#d69e2e', // amarelo
        '#e53e3e', // vermelho
        '#667eea'  // índigo
      ],
      cssVar: {
        '--node-gap-x':   '12px',
        '--node-gap-y':   '6px',
        '--main-gap-x':   '32px',
        '--main-gap-y':   '18px',
        '--root-radius':  '20px',
        '--main-radius':  '12px',
        '--root-color':   '#ffffff',
        '--root-bgcolor': '#2b6cb0',
        '--main-color':   '#1a202c',
        '--main-bgcolor': '#ffffff',
        '--main-bgcolor-transparent': 'rgba(255,255,255,0.85)',
        '--bgcolor':      '#f8fafc',
        '--selected':     '#4299e1',
        '--color':        '#4a5568',
        '--topic-padding':'3px 8px',
        '--map-padding':  '40px 60px'
      }
    };

    mind = new ME({
      el: '#map',
      direction: ME.SIDE !== undefined ? ME.SIDE : 2,
      draggable: true,
      contextMenu: false,
      toolBar: false,
      nodeMenu: false,
      keypress: false,
      theme: cfdmTheme,
    });
    mind.init(data);

    // Desativa pan interno do Mind Elixir (helper1/helper2 + edgeMoveController)
    // Usamos nosso próprio pan via mousedown/mousemove
    try {
      if (mind.helper1 && typeof mind.helper1.destroy === 'function') mind.helper1.destroy();
      if (mind.helper2 && typeof mind.helper2.destroy === 'function') mind.helper2.destroy();
      mind.helper1 = null; mind.helper2 = null;
    } catch(err) {}
    try {
      if (mind.edgeMoveController) {
        if (typeof mind.edgeMoveController.stop === 'function') mind.edgeMoveController.stop();
        mind.edgeMoveController = { stop:function(){}, clear:function(){}, move:function(){}, on:function(){} };
      }
    } catch(err) {}

    setTimeout(function() {
      if (mind && typeof mind.toCenter === 'function') mind.toCenter();
    }, 150);

    // Aplica tooltip com número hierárquico em cada nó (visível ao passar o mouse)
    setTimeout(function() {
      function applyNumTooltips(node) {
        if (!node) return;
        if (node.num) {
          try {
            var el = mind.findEle(node.id);
            if (el) {
              var tpc = el.querySelector ? el.querySelector('me-tpc') : null;
              if (!tpc && el.tagName === 'ME-TPC') tpc = el;
              if (tpc) tpc.title = node.num + '  ' + node.topic;
            }
          } catch(e2) {}
        }
        if (node.children) node.children.forEach(applyNumTooltips);
      }
      if (mind && mind.nodeData) applyNumTooltips(mind.nodeData);
    }, 300);

    if (mind.bus && typeof mind.bus.addListener === 'function') {
      mind.bus.addListener('selectNode', function(node) {
        document.title = 'SELECT:' + JSON.stringify({
          id:    node.id    || '',
          topic: node.topic || '',
          type:  node.type  || 'group'
        });
      });

      // Expandir/recolher ao clicar no nó
      mind.bus.addListener('selectNode', function(node) {
        if (!node || !node.children || node.children.length === 0) return;
        try {
          var el = mind.findEle(node.id);
          if (!el) return;
          if (node.expanded === false) {
            mind.expandNode(el);
          } else {
            // v5: collapseNode via expandNode com flag false
            if (typeof mind.collapseNode === 'function') {
              mind.collapseNode(el);
            } else {
              node.expanded = false;
              mind.linkDiv();
            }
          }
        } catch(err) {}
      });
    }
  } catch(e) {
    document.body.innerHTML =
      '<div style="color:red;padding:20px;"><b>Erro:</b><br>' + e.message + '</div>';
  }
}

function zoomIn()    { if (mind) mind.scale(mind.scaleVal * 1.5); }
function zoomOut()   { if (mind) mind.scale(mind.scaleVal / 1.5); }
function zoomReset() { if (mind && mind.toCenter) mind.toCenter(); }

// Muda direção do layout: 0=esquerda, 1=direita, 2=ambos
var currentData = null;
function setLayout(dir) {
  if (!mind || !currentData) return;
  try {
    if (typeof mind.destroy === 'function') mind.destroy();
    document.getElementById('map').innerHTML = '';
    mind = null;
  } catch(e) {}
  var ME = (typeof MindElixir === 'function') ? MindElixir
         : (typeof MindElixirLite !== 'undefined' && MindElixirLite.default) ? MindElixirLite.default
         : null;
  if (!ME) return;
  mind = new ME({
    el: '#map', direction: dir,
    draggable: true, contextMenu: false,
    toolBar: false, nodeMenu: false, keypress: false
  });
  mind.init(currentData);
  try {
    if (mind.helper1 && typeof mind.helper1.destroy === 'function') mind.helper1.destroy();
    if (mind.helper2 && typeof mind.helper2.destroy === 'function') mind.helper2.destroy();
    mind.helper1 = null; mind.helper2 = null;
    if (mind.edgeMoveController) {
      if (typeof mind.edgeMoveController.stop === 'function') mind.edgeMoveController.stop();
      mind.edgeMoveController = { stop:function(){}, clear:function(){}, move:function(){}, on:function(){} };
    }
  } catch(err) {}
  setTimeout(function() { if (mind && mind.toCenter) mind.toCenter(); }, 150);
}

// Guarda dados para reusar no setLayout
var _origInit = initMindMap;
initMindMap = function(data) {
  currentData = data;
  _origInit(data);
};

// ── Detecta se elemento é nó do mapa ─────────────────────────────────────────
function isMapNode(el) {
  while (el && el !== document.body) {
    var tag = el.tagName;
    if (tag === 'ME-TPC' || tag === 'ME-PARENT' || tag === 'ME-WRAPPER') return el;
    el = el.parentElement;
  }
  return null;
}

// ── Bloqueia pointer events do Mind Elixir (drag interno + edge detection) ────
// ME v5 usa pointerdown/pointermove/pointerup para arrastar nós e detectar bordas.
// Nossos handlers usam mouseevents. Bloqueamos pointer events para que ME nunca
// ative seu drag/edgeMoveController. O "click" continua funcionando (é evento separado).
;(function() {
  ['pointerdown','pointermove','pointerup','pointercancel'].forEach(function(evt) {
    document.addEventListener(evt, function(e) { e.stopPropagation(); }, true);
  });
})();

// ── Pan do fundo (mousedown/mousemove no background) ──────────────────────────
(function() {
  var panning = false, panMoved = false, sx = 0, sy = 0;

  function getXY(t) {
    var m = (t || '').match(/translate3d\(([^,]+),\s*([^,]+)/);
    return { x: m ? parseFloat(m[1]) : 0, y: m ? parseFloat(m[2]) : 0 };
  }

  document.addEventListener('mousedown', function(e) {
    if (!mind || !mind.map) return;
    if (e.button !== 0) return;
    if (isMapNode(e.target)) return;  // nó: deixa o drag de nó tratar
    panning = true; panMoved = false;
    sx = e.clientX; sy = e.clientY;
  }, true);

  document.addEventListener('mousemove', function(e) {
    if (!panning || !mind || !mind.map) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
    sx = e.clientX; sy = e.clientY;
    panMoved = true;
    document.body.style.cursor = 'grabbing';
    var pos = getXY(mind.map.style.transform);
    var scale = mind.scaleVal || 1;
    mind.map.style.transform =
      'translate3d(' + (pos.x+dx) + 'px,' + (pos.y+dy) + 'px,0) scale(' + scale + ')';
    e.preventDefault(); e.stopPropagation();
  }, true);

  document.addEventListener('mouseup', function() {
    panning = false; document.body.style.cursor = '';
  }, true);

  document.addEventListener('click', function(e) {
    if (panMoved) { e.stopPropagation(); panMoved = false; }
  }, true);
})();

// ── Drag livre de nós + Undo ───────────────────────────────────────────────────
var undoStack = [];

function undoNodeMove() {
  if (!undoStack.length) return;
  var last = undoStack.pop();
  last.el.style.left = last.ox + 'px';
  last.el.style.top  = last.oy + 'px';
  if (mind && typeof mind.linkDiv === 'function')
    setTimeout(function() { mind.linkDiv(); }, 0);
}

(function() {
  var dragEl = null;
  var sx = 0, sy = 0;
  var ox = 0, oy = 0;        // posição original (antes do drag)
  var hasMoved = false;

  function getWrapper(el) {
    // Sobe pelo DOM até encontrar me-tpc, me-parent ou me-wrapper
    while (el && el !== document.body) {
      var tag = el.tagName;
      if (tag === 'ME-TPC') {
        // me-tpc → me-parent → me-wrapper
        var p = el.parentElement;
        var w = p && p.parentElement;
        return (w && w.tagName === 'ME-WRAPPER') ? w : (p || el);
      }
      if (tag === 'ME-PARENT') {
        var w = el.parentElement;
        return (w && w.tagName === 'ME-WRAPPER') ? w : el;
      }
      if (tag === 'ME-WRAPPER') {
        // Só arrasta se não for o contêiner raiz (me-main, me-root)
        var parent = el.parentElement;
        if (parent && (parent.tagName === 'ME-CHILDREN' || parent.tagName === 'ME-MAIN'))
          return el;
      }
      el = el.parentElement;
    }
    return null;
  }

  document.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    var w = getWrapper(e.target);
    if (!w) return;
    dragEl = w;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(dragEl.style.left) || 0;
    oy = parseFloat(dragEl.style.top)  || 0;
    hasMoved = false;
    dragEl.style.position = 'relative';
    dragEl.style.zIndex   = '999';
    e.stopPropagation();
    e.preventDefault();
  }, true);

  var rafPending = false;
  document.addEventListener('mousemove', function(e) {
    if (!dragEl) return;
    var nx = ox + (e.clientX - sx);
    var ny = oy + (e.clientY - sy);
    if (!rafPending) {
      rafPending = true;
      requestAnimationFrame(function() {
        if (dragEl) {
          dragEl.style.left = nx + 'px';
          dragEl.style.top  = ny + 'px';
          hasMoved = true;
          if (mind && typeof mind.linkDiv === 'function') mind.linkDiv();
        }
        rafPending = false;
      });
    }
    e.stopPropagation();
    e.preventDefault();
  }, true);

  document.addEventListener('mouseup', function() {
    if (!dragEl) return;
    dragEl.style.zIndex = '';
    if (hasMoved) {
      // Só guarda no undo se o nó realmente se moveu
      undoStack.push({ el: dragEl, ox: ox, oy: oy });
      if (undoStack.length > 50) undoStack.shift();
      if (mind && typeof mind.linkDiv === 'function')
        setTimeout(function() { mind.linkDiv(); }, 0);
    }
    dragEl = null;
    hasMoved = false;
  }, true);

  // Ctrl+Z desfaz último movimento
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.key === 'z' || e.key === 'Z')) undoNodeMove();
  });
})();
</script>
</body>
</html>
