<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="qrc:/cfdmnote/mindmap/mind-elixir.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #f8fafc; }
  #map { width: 100%; height: 100%; }
  .mind-elixir-toolbar { display: none !important; }
</style>
</head>
<body>
<div id="map"></div>
<script src="qrc:/cfdmnote/mindmap/mind-elixir.js"></script>
<script>
var mind = null;

function initMindMap(data) {
  try {
    var ME = (typeof MindElixir === 'function') ? MindElixir
           : (MindElixir && MindElixir.default) ? MindElixir.default
           : null;

    if (!ME) {
      document.body.innerHTML =
        '<div style="color:red;padding:20px;">Erro: MindElixir não carregou.</div>';
      return;
    }

    if (mind) {
      if (typeof mind.destroy === 'function') mind.destroy();
      document.getElementById('map').innerHTML = '';
      mind = null;
    }

    var cfdmTheme = {
      name: 'CfdmNote',
      type: 'light',
      palette: [
        '#3182ce', // azul
        '#38a169', // verde
        '#805ad5', // roxo
        '#dd6b20', // laranja (só 1 de 8)
        '#319795', // teal
        '#d69e2e', // amarelo
        '#e53e3e', // vermelho
        '#667eea'  // índigo
      ],
      cssVar: {
        '--node-gap-x':   '12px',
        '--node-gap-y':   '6px',
        '--main-gap-x':   '32px',
        '--main-gap-y':   '18px',
        '--root-radius':  '20px',
        '--main-radius':  '12px',
        '--root-color':   '#ffffff',
        '--root-bgcolor': '#2b6cb0',
        '--main-color':   '#1a202c',
        '--main-bgcolor': '#ffffff',
        '--main-bgcolor-transparent': 'rgba(255,255,255,0.85)',
        '--bgcolor':      '#f8fafc',
        '--selected':     '#4299e1',
        '--color':        '#4a5568',
        '--topic-padding':'3px 8px',
        '--map-padding':  '40px 60px'
      }
    };

    mind = new ME({
      el: '#map',
      direction: ME.SIDE !== undefined ? ME.SIDE : 2,
      draggable: true,
      contextMenu: false,
      toolBar: false,
      nodeMenu: false,
      keypress: false,
      theme: cfdmTheme,
    });
    mind.init(data);

    setTimeout(function() {
      if (mind && typeof mind.toCenter === 'function') mind.toCenter();
    }, 150);

    if (mind.bus && typeof mind.bus.addListener === 'function') {
      mind.bus.addListener('selectNode', function(node) {
        document.title = 'SELECT:' + JSON.stringify({
          id:    node.id    || '',
          topic: node.topic || '',
          type:  node.type  || 'group'
        });
      });
    }
  } catch(e) {
    document.body.innerHTML =
      '<div style="color:red;padding:20px;"><b>Erro:</b><br>' + e.message + '</div>';
  }
}

function zoomIn()    { if (mind) mind.scale(mind.scaleVal * 1.3); }
function zoomOut()   { if (mind) mind.scale(mind.scaleVal * 0.75); }
function zoomReset() { if (mind && mind.toCenter) mind.toCenter(); }

// Pan manual — captura qualquer clique que NÃO seja num nó (me-tpc)
(function() {
  var panning = false, sx = 0, sy = 0;

  function getXY(t) {
    var m = (t || '').match(/translate3d\(([^,]+),\s*([^,]+)/);
    return { x: m ? parseFloat(m[1]) : 0, y: m ? parseFloat(m[2]) : 0 };
  }

  function isNode(el) {
    // me-tpc = topic (texto do nó), me-epnode = nó expandível
    while (el && el !== document.body) {
      var tag = (el.tagName || '').toLowerCase();
      if (tag === 'me-tpc' || tag === 'me-epnode' || tag === 'me-wrapper') return true;
      el = el.parentElement;
    }
    return false;
  }

  document.addEventListener('mousedown', function(e) {
    if (!mind || !mind.map) return;
    if (e.button !== 0) return;          // só botão esquerdo
    if (isNode(e.target)) return;        // ignora clique em nós
    panning = true;
    sx = e.clientX; sy = e.clientY;
    document.body.style.cursor = 'grabbing';
    e.preventDefault();
  }, true);

  document.addEventListener('mousemove', function(e) {
    if (!panning || !mind || !mind.map) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    sx = e.clientX; sy = e.clientY;
    var pos = getXY(mind.map.style.transform);
    var scale = mind.scaleVal || 1;
    mind.map.style.transform =
      'translate3d(' + (pos.x+dx) + 'px,' + (pos.y+dy) + 'px,0) scale(' + scale + ')';
  }, true);

  document.addEventListener('mouseup', function() {
    panning = false;
    document.body.style.cursor = '';
  }, true);
})();
</script>
</body>
</html>
