<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="qrc:/cfdmnote/mindmap/mind-elixir.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1b2e; }
  #map { width: 100%; height: 100%; }

  /* Sobrescreve tema para combinar com CfdmNote */
  me-root me-parent .mind-elixir-node {
    background: #2b6cb0;
    color: white;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  me-epnode .mind-elixir-node {
    font-size: 12px;
  }
  .mind-elixir-toolbar {
    background: #1a365d !important;
    border-radius: 8px;
  }
  .mind-elixir-toolbar button {
    color: white !important;
  }
</style>
</head>
<body>
<div id="map"></div>

<script src="qrc:/cfdmnote/mindmap/mind-elixir.js"></script>
<script>
var mind = null;

// Paleta de cores por índice de grupo
var COLORS = [
  '#3182ce','#38a169','#dd6b20','#805ad5',
  '#e53e3e','#00b5d8','#d69e2e','#319795',
  '#667eea','#ed64a6'
];

function colorFor(idx) {
  return COLORS[idx % COLORS.length];
}

// Recebe o JSON do banco e inicializa o mapa
function initMindMap(jsonStr) {
  try {
    var data = JSON.parse(jsonStr);

    // O IIFE exporta o construtor em .default — MindElixir em si é o módulo
    var ME = (typeof MindElixir === 'function') ? MindElixir
           : (MindElixir && MindElixir.default) ? MindElixir.default
           : null;

    if (!ME) {
      document.body.innerHTML =
        '<div style="color:orange;padding:20px;font-family:sans-serif;">'
        + 'Erro: MindElixir não carregou. Verifique o arquivo JS.</div>';
      return;
    }

    // Se já existe, destroi e recria
    if (mind) {
      document.getElementById('map').innerHTML = '';
      mind = null;
    }

    mind = new ME({
      el: '#map',
      direction: ME.SIDE !== undefined ? ME.SIDE : 2,
      data: data,
      draggable: true,
      contextMenu: false,
      toolBar: true,
      nodeMenu: false,
      keypress: true,
      before: {
        insertSibling: function() { return false; },
        addChild:      function() { return false; },
        editNode:      function() { return false; },
      }
    });
    mind.init(data);

    // Notifica Qt quando um nó é selecionado
    mind.bus.addListener('selectNode', function(node) {
      var payload = JSON.stringify({
        id:    node.id    || '',
        topic: node.topic || '',
        type:  node.type  || 'group'
      });
      // Envia para Qt via title (interceptado pelo Qt)
      document.title = 'SELECT:' + payload;
    });

  } catch(e) {
    document.body.innerHTML =
      '<div style="color:white;padding:20px;font-family:sans-serif;">'
      + '<b>Erro ao carregar mapa mental:</b><br>' + e.message + '</div>';
  }
}

// Chamada pelo Qt para atualizar o mapa sem recriar
function updateMindMap(jsonStr) {
  initMindMap(jsonStr);
}
</script>
</body>
</html>
