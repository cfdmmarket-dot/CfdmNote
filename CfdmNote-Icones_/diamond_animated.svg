<?xml version="1.0" encoding="UTF-8"?>
<!-- CfdmNote Animated Splash — diamante com anel orbital girando -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="55%">
      <stop offset="0%"   stop-color="#1a2a6c"/>
      <stop offset="100%" stop-color="#080e2a"/>
    </radialGradient>
    <linearGradient id="cm" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="cl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cr" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#bfdbfe"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="pl" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="pr" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="pc" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#0c1a4a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="128" cy="128" r="124" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="#1e40af" stroke-width="1.5" opacity="0.40"/>

  <!-- Ambient pulse -->
  <ellipse cx="128" cy="128" rx="88" ry="68" fill="#3b82f6" opacity="0.06" filter="url(#softglow)">
    <animate attributeName="opacity" values="0.04;0.12;0.04" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ── RING BACK ── -->
  <ellipse cx="128" cy="152" rx="112" ry="28"
           fill="none" stroke="#3b82f6" stroke-width="6" opacity="0.22"/>

  <!-- ── PAVILION ── -->
  <polygon points="24,128   76,128  128,220"  fill="url(#pl)"  opacity="0.93"/>
  <polygon points="76,128  128,128  128,220"  fill="url(#pc)"  opacity="0.84"/>
  <polygon points="128,128 180,128  128,220"  fill="url(#pc)"  opacity="0.80"/>
  <polygon points="180,128 232,128  128,220"  fill="url(#pr)"  opacity="0.90"/>
  <line x1="76"  y1="128" x2="128" y2="220" stroke="white" stroke-width="0.8" opacity="0.20"/>
  <line x1="128" y1="128" x2="128" y2="220" stroke="white" stroke-width="1.2" opacity="0.28"/>
  <line x1="180" y1="128" x2="128" y2="220" stroke="white" stroke-width="0.8" opacity="0.20"/>
  <polyline points="24,128 128,220 232,128"   fill="none" stroke="#60a5fa" stroke-width="1.8" opacity="0.65"/>

  <!-- ── RING FRONT animated ── -->
  <!-- Base ring stroke -->
  <ellipse cx="128" cy="152" rx="112" ry="28"
           fill="none" stroke="#60a5fa" stroke-width="8" opacity="0.55"/>
  <!-- Animated bright highlight sweeping around ring -->
  <ellipse cx="128" cy="152" rx="112" ry="28"
           fill="none" stroke="white" stroke-width="5"
           stroke-dasharray="80 295">
    <animate attributeName="stroke-dashoffset"
             from="0" to="-375"
             dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Secondary glow sweep -->
  <ellipse cx="128" cy="152" rx="112" ry="28"
           fill="none" stroke="#93c5fd" stroke-width="9"
           stroke-dasharray="40 335" opacity="0.45">
    <animate attributeName="stroke-dashoffset"
             from="-40" to="-415"
             dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ── CROWN ── -->
  <polygon points="24,128  78,38  178,38  232,128"  fill="url(#cm)" opacity="0.88"/>
  <polygon points="24,128   78,38   78,128"         fill="#bfdbfe"  opacity="0.36"/>
  <polygon points="78,38  128,38  128,128   78,128" fill="#eff6ff"  opacity="0.20"/>
  <polygon points="128,38 178,38  178,128  128,128" fill="#3b82f6"  opacity="0.17"/>
  <polygon points="178,38 232,128  178,128"         fill="#1e40af"  opacity="0.42"/>

  <line x1="78"  y1="38" x2="24"  y2="128" stroke="#93c5fd" stroke-width="1.0" opacity="0.38"/>
  <line x1="128" y1="38" x2="128" y2="128" stroke="white"   stroke-width="0.9" opacity="0.26"/>
  <line x1="178" y1="38" x2="232" y2="128" stroke="#93c5fd" stroke-width="1.0" opacity="0.38"/>

  <polygon points="78,38  178,38  164,54  92,54"  fill="white" opacity="0.35"/>
  <line x1="78" y1="38" x2="178" y2="38"          stroke="white" stroke-width="3.0" opacity="0.92"/>
  <polyline points="24,128 78,38 178,38 232,128"   fill="none" stroke="#93c5fd" stroke-width="2.0" opacity="0.72"/>
  <line x1="24" y1="128" x2="232" y2="128"        stroke="#bfdbfe" stroke-width="1.8" opacity="0.68"/>

  <!-- ── SPARKLES animated ── -->
  <g transform="translate(68,30)" filter="url(#glow)">
    <g opacity="1">
      <animate attributeName="opacity" values="0.4;1.0;0.4" dur="2.5s" repeatCount="indefinite"/>
      <line x1="0" y1="-14" x2="0"   y2="14"  stroke="white" stroke-width="2.2"/>
      <line x1="-14" y1="0" x2="14"  y2="0"   stroke="white" stroke-width="2.2"/>
      <line x1="-9"  y1="-9" x2="9"  y2="9"   stroke="white" stroke-width="1.1"/>
      <line x1="9"   y1="-9" x2="-9" y2="9"   stroke="white" stroke-width="1.1"/>
    </g>
  </g>
  <g transform="translate(194,32)" filter="url(#glow)">
    <g opacity="1">
      <animate attributeName="opacity" values="1.0;0.3;1.0" dur="2.5s" repeatCount="indefinite"/>
      <line x1="0" y1="-9" x2="0"  y2="9"   stroke="#bfdbfe" stroke-width="1.8"/>
      <line x1="-9" y1="0" x2="9"  y2="0"   stroke="#bfdbfe" stroke-width="1.8"/>
      <line x1="-6" y1="-6" x2="6" y2="6"   stroke="#bfdbfe" stroke-width="0.9"/>
      <line x1="6"  y1="-6" x2="-6" y2="6"  stroke="#bfdbfe" stroke-width="0.9"/>
    </g>
  </g>
  <circle cx="100" cy="34" r="4.5" fill="white" opacity="0.80" filter="url(#glow)">
    <animate attributeName="r"       values="3;5.5;3"   dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1.0;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="156" cy="32" r="3.0" fill="white" opacity="0.65" filter="url(#glow)">
    <animate attributeName="r"       values="2;4;2"     dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.8s" repeatCount="indefinite"/>
  </circle>
</svg>
